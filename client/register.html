<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WalletX</title>
    <link rel="stylesheet" href="css/walletx-fintech.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            padding: var(--spacing-xl);
        }
        
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: var(--spacing-2xl);
            max-width: 500px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            animation: slideUp 0.5s ease;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .auth-brand {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-md);
        }
        
        .auth-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
        }
        
        .auth-subtitle {
            color: var(--text-tertiary);
            font-size: 0.9375rem;
        }
        
        .show-password-btn {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 1.125rem;
            padding: var(--spacing-sm);
        }
        
        .password-strength {
            margin-top: var(--spacing-sm);
            font-size: 0.875rem;
            font-weight: 600;
        }
        
        .password-strength.weak { color: var(--error); }
        .password-strength.medium { color: var(--warning); }
        .password-strength.strong { color: var(--success); }
        
        .auth-links {
            text-align: center;
            margin-top: var(--spacing-lg);
            color: var(--text-tertiary);
        }
        
        .auth-links a {
            color: var(--primary);
            font-weight: 600;
        }
        
        .auth-links a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-brand">💳 WalletX</div>
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join WalletX and start managing your finances</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="Enter mobile number" required autocomplete="tel">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="country">Country</label>
                        <select id="country" required>
                            <option value="">Select Country</option>
                            <option value="IN">India</option>
                            <option value="US">United States</option>
                            <option value="GB">United Kingdom</option>
                            <option value="AE">UAE</option>
                            <option value="SG">Singapore</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="currency">Preferred Currency</label>
                        <select id="currency" required>
                            <option value="INR">INR</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="AED">AED</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" placeholder="Create a strong password" required autocomplete="new-password" onkeyup="checkPasswordStrength()">
                        <button type="button" class="show-password-btn" onclick="togglePassword('password')">👁️</button>
                    </div>
                    <div id="passwordStrength" class="password-strength"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div style="position: relative;">
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
                        <button type="button" class="show-password-btn" onclick="togglePassword('confirmPassword')">👁️</button>
                    </div>
                </div>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>

                <button type="submit" class="btn btn-primary btn-full btn-large">
                    <span id="registerText">Create Account</span>
                    <span id="registerLoader" style="display: none;">Creating account...</span>
                </button>
            </form>

            <div style="text-align: center; margin-top: var(--spacing-lg);">
                <p style="color: var(--text-tertiary); margin-bottom: var(--spacing-sm);">Or try the demo first</p>
                <button type="button" onclick="goToDemoLogin()" class="btn btn-secondary btn-full">
                    🎭 Use Demo Account Instead
                </button>
            </div>

            <div class="auth-links">
                Already have an account? <a href="login.html">Login</a>
            </div>

            <div class="auth-links">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        function goToDemoLogin() {
            window.location.href = 'login.html?demo=true';
        }

        function togglePassword(fieldId) {
            const input = document.getElementById(fieldId);
            const btn = input.nextElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (!password) {
                strengthDiv.textContent = '';
                return;
            }
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            if (strength <= 2) {
                strengthDiv.textContent = 'Weak password';
                strengthDiv.className = 'password-strength weak';
            } else if (strength === 3) {
                strengthDiv.textContent = 'Medium password';
                strengthDiv.className = 'password-strength medium';
            } else {
                strengthDiv.textContent = 'Strong password';
                strengthDiv.className = 'password-strength strong';
            }
        }

        function showMessage(type, message) {
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            
            if (type === 'error') {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            } else {
                successEl.textContent = message;
                successEl.style.display = 'block';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showMessage('error', 'Passwords do not match');
                return;
            }
            
            if (password.length < 8) {
                showMessage('error', 'Password must be at least 8 characters');
                return;
            }
            
            const registerText = document.getElementById('registerText');
            const registerLoader = document.getElementById('registerLoader');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            registerText.style.display = 'none';
            registerLoader.style.display = 'inline';

            const userData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                mobile: document.getElementById('mobile').value,
                country: document.getElementById('country').value,
                preferredCurrency: document.getElementById('currency').value,
                password: password,
                confirmPassword: confirmPassword
            };

            try {
                const response = await api.register(userData);
                
                if (response.success) {
                    showMessage('success', 'Account created successfully! Redirecting to login...');
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage('error', response.message || 'Registration failed');
                    submitBtn.disabled = false;
                    registerText.style.display = 'inline';
                    registerLoader.style.display = 'none';
                }
            } catch (error) {
                showMessage('error', error.message || 'Registration failed. Please try again.');
                submitBtn.disabled = false;
                registerText.style.display = 'inline';
                registerLoader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
